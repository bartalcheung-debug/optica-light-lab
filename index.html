<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>像差实验室 · 3D 光学设计</title>
  <meta name="description" content="通过可旋转的三维光学模型，直观观察球差、彗差与色差。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%230b1220'/%3E%3Ccircle cx='20' cy='20' r='10' fill='none' stroke='%235fe0d2' stroke-width='2'/%3E%3Cpath d='M4 20h32M20 4v32' stroke='%23f1b85b' stroke-width='1.5'/%3E%3C/svg%3E">
  <style>
    :root{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;color:#eef4fb;background:#080d16;font-synthesis:none;--bg:#080d16;--panel:#101a29;--panel2:#0c1421;--line:#203047;--muted:#8fa3bb;--teal:#5fe0d2;--amber:#f1b85b;--violet:#bb9cff;--red:#ff758e}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg)}
    body{font-size:16px;overflow-x:hidden}
    button,input{font:inherit}
    button{cursor:pointer;color:inherit}
    button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
    .app{min-height:100vh;display:flex;flex-direction:column}
    header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line);background:rgba(8,13,22,.92);position:relative;z-index:2}
    .brand{display:flex;align-items:center;gap:13px}
    .brand-mark{width:33px;height:33px;border:1px solid #31526a;border-radius:10px;display:grid;place-items:center;background:#0d1b2c}
    .brand-mark svg{width:24px;height:24px;fill:none;stroke:var(--teal);stroke-width:1.6}
    h1{font-size:20px;letter-spacing:.08em;font-weight:650;margin:0}
    .brand small{font-size:11px;letter-spacing:.2em;color:#7c91aa;margin-left:2px}
    .header-right{display:flex;align-items:center;gap:18px;color:#7f95ae;font-size:13px}
    .reset{border:1px solid #29405b;border-radius:7px;padding:8px 13px;background:#0e1a2a;color:#b9c9da;font-size:13px}
    .reset:hover{border-color:#4d7893;background:#13243a}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;flex:1;padding:16px;min-height:0}
    .stage{position:relative;min-height:calc(100vh - 104px);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#090f1b;box-shadow:0 15px 50px rgba(0,0,0,.22)}
    #scene{display:block;width:100%;height:100%;min-height:520px;touch-action:none;cursor:grab}
    #scene.dragging{cursor:grabbing}
    .stage-top,.stage-bottom{position:absolute;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;color:#7890a9;font-size:12px;letter-spacing:.06em}
    .stage-top{top:18px}.stage-bottom{bottom:16px}
    .stage-top strong{font-size:13px;font-weight:600;color:#d7e4f2;letter-spacing:.12em}
    .stage-top span:last-child{color:#5d718a}
    .stage-bottom span:last-child{color:#637a94}
    .panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:20px 19px;display:flex;flex-direction:column;min-width:0}
    .panel-title{font-size:12px;color:#7890a9;letter-spacing:.14em;margin:0 0 13px}
    .mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:22px}
    .mode-tabs button{border:1px solid #24364c;background:#0b1422;border-radius:7px;padding:10px 4px;color:#8298b0;font-size:14px}
    .mode-tabs button:hover{border-color:#3d6278;color:#c7d8e7}
    .mode-tabs button.active{background:#153040;border-color:#4c9f9b;color:#e6fffb;box-shadow:inset 0 0 0 1px rgba(95,224,210,.16)}
    .control{padding:14px 0 17px;border-top:1px solid #1c2b40}
    .control:first-of-type{border-top:0;padding-top:0}
    .control-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
    .control label{font-size:14px;color:#c7d4e1}
    .value{font-size:14px;color:var(--teal);font-variant-numeric:tabular-nums}
    .value em{font-style:normal;color:#7e94ad;font-size:12px;margin-left:3px}
    input[type=range]{appearance:none;width:100%;height:4px;border-radius:5px;background:#25384e;display:block;margin:8px 0 8px;--fill:50%;background:linear-gradient(90deg,var(--teal) 0 var(--fill),#25384e var(--fill) 100%)}
    input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:var(--teal);border:3px solid #10212e;box-shadow:0 0 0 1px #66c9c0}
    input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--teal);border:3px solid #10212e;box-shadow:0 0 0 1px #66c9c0}
    .range-labels{display:flex;justify-content:space-between;font-size:11px;color:#657a92}
    .focus-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .focus-row button{border:1px solid #263a50;background:#0b1422;border-radius:6px;color:#8298b0;padding:8px 4px;font-size:13px}
    .focus-row button.active{border-color:#9b7fde;color:#e9e2ff;background:#211c38}
    .switches{display:flex;flex-wrap:wrap;gap:8px}
    .switch{display:flex;align-items:center;gap:7px;color:#98abc0;font-size:13px}
    .switch input{accent-color:var(--teal);width:15px;height:15px;margin:0}
    .metrics{border-top:1px solid #1c2b40;margin-top:3px;padding-top:16px}
    .metrics h2{font-size:12px;color:#7890a9;letter-spacing:.14em;margin:0 0 12px;font-weight:500}
    .metric{display:flex;align-items:baseline;justify-content:space-between;padding:7px 0}
    .metric span:first-child{font-size:13px;color:#91a5ba}
    .metric strong{font-size:18px;color:#e8f2fb;font-variant-numeric:tabular-nums;font-weight:600}
    .metric strong small{font-size:11px;color:#8398ae;margin-left:3px;font-weight:400}
    .insight{margin-top:auto;border:1px solid #29415b;border-radius:8px;padding:12px 13px;background:#0c1726;color:#9db2c7;font-size:13px;line-height:1.65}
    .insight b{color:#d8e9f5;font-weight:600;display:block;margin-bottom:3px}
    .insight[data-mode=spherical]{border-color:#3a4d57}.insight[data-mode=coma]{border-color:#514463}.insight[data-mode=chromatic]{border-color:#56473b}
    @media(max-width:900px){
      header{padding:0 18px}.header-right>span{display:none}
      .layout{grid-template-columns:1fr;padding:10px}.stage{min-height:62vh}#scene{min-height:430px}.panel{padding:18px}
      .insight{margin-top:16px}
    }
    @media(max-width:520px){
      header{height:62px}.brand small{display:none}h1{font-size:18px}.layout{padding:8px;gap:8px}.stage{min-height:55vh;border-radius:9px}#scene{min-height:340px}
      .stage-top,.stage-bottom{left:12px;right:12px;font-size:11px}.stage-top{top:13px}.stage-bottom{bottom:12px}.panel{border-radius:9px;padding:16px}.mode-tabs{margin-bottom:17px}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="8.5"/><path d="M2 15h26M15 2v26"/><path d="M8.5 8.5l13 13M21.5 8.5l-13 13" opacity=".45"/></svg></span>
      <h1>像差实验室</h1><small>3D OPTICS</small>
    </div>
    <div class="header-right"><span>拖动场景旋转 · 滚轮缩放</span><button class="reset" id="reset" type="button">重置</button></div>
  </header>
  <main class="layout">
    <section class="stage" aria-label="三维像差演示">
      <canvas id="scene" aria-label="可旋转的三维光线与透镜模型"></canvas>
      <div class="stage-top"><strong id="scene-mode">球差</strong><span id="scene-state">近轴光线 · 当前焦面</span></div>
      <div class="stage-bottom"><span>光轴 z</span><span id="scene-help">拖动旋转视角</span></div>
    </section>
    <aside class="panel" aria-label="像差参数">
      <p class="panel-title">ABERRATION MODEL</p>
      <div class="mode-tabs" role="tablist" aria-label="选择像差类型">
        <button class="active" type="button" data-mode="spherical" role="tab" aria-selected="true">球差</button>
        <button type="button" data-mode="coma" role="tab" aria-selected="false">彗差</button>
        <button type="button" data-mode="chromatic" role="tab" aria-selected="false">色差</button>
      </div>
      <div class="control">
        <div class="control-head"><label for="aperture">孔径 / 边缘光线</label><span class="value" id="aperture-value">72<em>%</em></span></div>
        <input id="aperture" type="range" min="25" max="100" value="72" step="1">
        <div class="range-labels"><span>近轴</span><span>全孔径</span></div>
      </div>
      <div class="control">
        <div class="control-head"><label for="field">视场角</label><span class="value" id="field-value">4.0<em>°</em></span></div>
        <input id="field" type="range" min="0" max="12" value="4" step=".1">
        <div class="range-labels"><span>轴上</span><span>12°</span></div>
      </div>
      <div class="control">
        <div class="control-head"><label for="wavelength">波长</label><span class="value" id="wavelength-value">550<em>nm</em></span></div>
        <input id="wavelength" type="range" min="450" max="650" value="550" step="1">
        <div class="range-labels"><span>蓝 450</span><span>红 650</span></div>
      </div>
      <div class="control">
        <div class="control-head"><label for="focus-position">汇聚面位置 z</label><span class="value" id="focus-value">4.20<em>mm</em></span></div>
        <input id="focus-position" type="range" min="3.20" max="5.20" value="4.20" step=".05">
        <div class="range-labels"><span>3.20 mm</span><span>5.20 mm</span></div>
      </div>
      <div class="control">
        <div class="control-head"><label>快速对焦</label></div>
        <div class="focus-row">
          <button type="button" data-focus="paraxial" class="active">近轴焦面</button>
          <button type="button" data-focus="best">最佳焦面</button>
        </div>
      </div>
      <div class="control">
        <div class="control-head"><label>显示</label></div>
        <div class="switches">
          <label class="switch"><input id="show-rays" type="checkbox" checked> 光线</label>
          <label class="switch"><input id="show-mesh" type="checkbox" checked> 透镜网格</label>
        </div>
      </div>
      <div class="metrics" aria-live="polite">
        <h2>实时读数</h2>
        <div class="metric"><span>纵向像差 Δz</span><strong id="metric-z">—<small>mm</small></strong></div>
        <div class="metric"><span>横向像差 Δx</span><strong id="metric-x">—<small>mm</small></strong></div>
        <div class="metric"><span>焦斑直径</span><strong id="metric-spot">—<small>mm</small></strong></div>
      </div>
      <div class="insight" id="insight" data-mode="spherical"><b id="insight-title">球差</b><span id="insight-copy">边缘光线与近轴光线落在不同 z 位置。</span></div>
    </aside>
  </main>
</div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const TAU = Math.PI * 2;
  const state = {mode:"spherical", aperture:.72, field:4, wavelength:550, focus:"paraxial", focusZ:4.2, showRays:true, showMesh:true, yaw:-.56, pitch:.20, zoom:1};
  const colors = {teal:"#5fe0d2", amber:"#f1b85b", violet:"#bb9cff", red:"#ff758e", blue:"#66a7ff", glass:"#61c9d2"};
  let dpr = 1, w = 0, h = 0, dragging = false, lastX = 0, lastY = 0;
  const $ = id => document.getElementById(id);
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const fmt = (v,n=2) => Number(v).toFixed(n);
  const modeNames = {spherical:"球差", coma:"彗差", chromatic:"色差"};
  function resize(){
    const r = canvas.getBoundingClientRect(); dpr = Math.min(2,window.devicePixelRatio||1);
    w = Math.max(1, r.width); h = Math.max(1,r.height); canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); draw();
  }
  function project(p){
    const cy=Math.cos(state.yaw), sy=Math.sin(state.yaw), cp=Math.cos(state.pitch), sp=Math.sin(state.pitch);
    const x1=p.x*cy-p.z*sy, z1=p.x*sy+p.z*cy, y1=p.y*cp-z1*sp, z2=p.y*sp+z1*cp;
    const depth=13+z2, scale=(Math.min(w,h)*.105*state.zoom)/Math.max(3,depth);
    return {x:w*.5+x1*scale*9,y:h*.53-y1*scale*9,depth};
  }
  function line3(a,b,color,width=1,alpha=1,dash=[]){
    const p=project(a),q=project(b); ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.restore();
  }
  function poly3(points,fill,stroke,alpha=1){
    if(!points.length)return;ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();const p0=project(points[0]);ctx.moveTo(p0.x,p0.y);for(let i=1;i<points.length;i++){const p=project(points[i]);ctx.lineTo(p.x,p.y)}ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}ctx.restore();
  }
  function text3(text,p,color="#8ea6be",size=11,align="center"){
    const q=project(p);ctx.save();ctx.fillStyle=color;ctx.font=size+"px Inter,'Noto Sans SC',sans-serif";ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillText(text,q.x,q.y);ctx.restore();
  }
  function lensSurface(){
    const seg=28, front=[], back=[];
    for(let i=0;i<=seg;i++){const a=TAU*i/seg;const x=Math.cos(a)*1.75,y=Math.sin(a)*1.75;front.push({x,y,z:-.26});back.push({x,y,z:.26})}
    for(let i=0;i<seg;i++){const a=front[i],b=front[i+1],c=back[i+1],d=back[i];poly3([a,b,c,d],"rgba(73,187,202,.08)","#4f9baa",.8)}
    if(!state.showMesh)return;
    for(let j=1;j<18;j++){const r=1.75*j/18;const f=[],b=[];for(let i=0;i<=seg;i++){const a=TAU*i/seg;f.push({x:Math.cos(a)*r,y:Math.sin(a)*r,z:-.26});b.push({x:Math.cos(a)*r,y:Math.sin(a)*r,z:.26})}for(let i=0;i<seg;i++){line3(f[i],f[i+1],colors.glass,.55,.38);line3(b[i],b[i+1],colors.glass,.55,.38)}}
    for(let i=0;i<seg;i++){line3(front[i],back[i],colors.glass,.55,.4)}
  }
  function drawGrid(){
    for(let z=-5;z<=6;z+=1)line3({x:-2.65,y:-2.05,z},{x:2.65,y:-2.05,z},"#1b3243",.65,.62);
    for(let x=-2;x<=2;x+=1)line3({x,y:-2.05,z:-5},{x,y:-2.05,z:6},"#1b3243",.65,.62);
    line3({x:0,y:0,z:-5.2},{x:0,y:0,z:6.4},"#8aa0b4",.8,.58,[5,6]);
    line3({x:-2.8,y:0,z:-5},{x:2.8,y:0,z:-5},"#274154",.7,.7);
  }
  function drawFocalPlane(z){
    const corners=[{x:-2.3,y:-1.75,z},{x:2.3,y:-1.75,z},{x:2.3,y:1.75,z},{x:-2.3,y:1.75,z}];
    poly3(corners,"rgba(107,151,193,.045)","#3c5d75",.9);
    for(let x=-2;x<=2;x+=.5)line3({x,y:-1.75,z},{x,y:1.75,z},"#45657b",.45,.4);
    for(let y=-1.5;y<=1.5;y+=.5)line3({x:-2.3,y,z},{x:2.3,y,z},"#45657b",.45,.4);
    text3(state.focus==="best"?"最佳焦面":"近轴焦面",{x:2.48,y:1.55,z},"#86a7c2",11,"left");
  }
  function wavelengthColor(wl){
    if(wl<=500){const t=(wl-450)/50;return "rgb("+Math.round(102-30*t)+","+Math.round(165+50*t)+",255)"}
    if(wl<=580){const t=(wl-500)/80;return "rgb("+Math.round(72+25*t)+","+Math.round(215-35*t)+","+Math.round(255-130*t)+")"}
    const t=(wl-580)/70;return "rgb(255,"+Math.round(180-90*t)+","+Math.round(105-75*t)+")";
  }
  function aberrationFor(r,wl){
    const ap=state.aperture, field=state.field*Math.PI/180;
    if(state.mode==="spherical")return {x:0,y:0,z:4.2-.92*ap*ap*r*r};
    if(state.mode==="coma")return {x:.95*Math.tan(field)*(.32+.68*r*r),y:.12*Math.sin(TAU*r)*r,z:4.2-.08*ap*ap*r};
    return {x:0,y:0,z:4.2-(wl-550)*.0042};
  }
  function focalPlane(){
    if(state.focus==="manual")return state.focusZ;
    if(state.focus==="paraxial")return 4.2;
    if(state.mode==="spherical")return 4.2-.46*state.aperture*state.aperture;
    if(state.mode==="chromatic")return 4.2-(state.wavelength-550)*.0042;
    return 4.2;
  }
  function rayBundle(){
    const rays=[]; const rings=state.mode==="chromatic"?[.45,1]:[.25,.62,1];
    const n=4; const wavelengths=state.mode==="chromatic"?[450,550,650]:[state.wavelength];
    wavelengths.forEach(wl=>rings.forEach((r,ri)=>{
      const rr=r*state.aperture; for(let i=0;i<n;i++){const a=TAU*i/n+(ri%2)*.18;const hit={x:rr*Math.cos(a)*1.7,y:rr*Math.sin(a)*1.7,z:0};const f=aberrationFor(r,wl);const target={x:f.x,y:f.y,z:f.z};const beyond={x:target.x+(target.x-hit.x)*.35,y:target.y+(target.y-hit.y)*.35,z:target.z+.95};const sensorT=(focalPlane())/target.z;const sensor={x:hit.x+(target.x-hit.x)*sensorT,y:hit.y+(target.y-hit.y)*sensorT,z:focalPlane()};rays.push({wl,r,hit,target,beyond,sensor,color:wavelengthColor(wl)})}
    })); return rays;
  }
  function drawRays(){
    if(!state.showRays)return; const rays=rayBundle();
    const field=state.field*Math.PI/180;
    rays.forEach(ray=>{const start={x:ray.hit.x-Math.tan(field)*5,y:ray.hit.y,z:-5};line3(start,ray.hit,ray.color,1.35,.78);line3(ray.hit,ray.target,ray.color,1.45,.92);line3(ray.target,ray.beyond,ray.color,.9,.34,[3,4])});
    rays.forEach(ray=>{const p=project(ray.sensor);ctx.save();ctx.fillStyle=ray.color;ctx.globalAlpha=.83;ctx.beginPath();ctx.arc(p.x,p.y,2.15,0,TAU);ctx.fill();ctx.restore()});
  }
  function draw(){
    if(!w||!h)return; const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#0b1423");g.addColorStop(1,"#080d16");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    drawGrid(); drawFocalPlane(focalPlane()); drawRays(); lensSurface();
    text3("LENS",{x:0,y:2.15,z:0},"#78a9b4",10); text3("OBJECT",{x:0,y:1.85,z:-4.9},"#728ca3",10); text3("SENSOR",{x:0,y:1.85,z:focalPlane()},"#789bb7",10);
    updateReadout();
  }
  function updateReadout(){
    const ap=state.aperture, field=state.field, z=state.mode==="spherical"?-.92*ap*ap:state.mode==="chromatic"?-(state.wavelength-550)*.0042:-.08*ap*ap;
    const x=state.mode==="coma"?.52*Math.tan(field*Math.PI/180)*ap*ap:0;
    const spot=state.mode==="spherical"?Math.abs(z)*.42:state.mode==="coma"?Math.abs(x)*.7:Math.abs((state.wavelength-550)*.0042)*.46;
    $("metric-z").innerHTML=fmt(z,2)+"<small>mm</small>";$("metric-x").innerHTML=fmt(x,2)+"<small>mm</small>";$("metric-spot").innerHTML=fmt(spot,2)+"<small>mm</small>";
    $("aperture-value").innerHTML=Math.round(ap*100)+"<em>%</em>";$("field-value").innerHTML=fmt(field,1)+"<em>°</em>";$("wavelength-value").innerHTML=Math.round(state.wavelength)+"<em>nm</em>";
    $("scene-mode").textContent=modeNames[state.mode];$("scene-state").textContent=(state.focus==="best"?"最佳焦面":state.focus==="manual"?"可移动汇聚面":"近轴光线 · 当前焦面");$("focus-value").innerHTML=fmt(focalPlane(),2)+"<em>mm</em>";
  }
  function syncRange(input,value,min,max){input.value=value;input.style.setProperty("--fill",((value-min)/(max-min)*100)+"%")}
  function syncUI(){
    syncRange($("aperture"),state.aperture*100,25,100);syncRange($("field"),state.field,0,12);syncRange($("wavelength"),state.wavelength,450,650);syncRange($("focus-position"),focalPlane(),3.2,5.2);
    document.querySelectorAll("[data-mode]").forEach(b=>{const on=b.dataset.mode===state.mode;b.classList.toggle("active",on);b.setAttribute("aria-selected",String(on))});
    document.querySelectorAll("[data-focus]").forEach(b=>b.classList.toggle("active",b.dataset.focus===state.focus));
    $("show-rays").checked=state.showRays;$("show-mesh").checked=state.showMesh;draw();
  }
  document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{state.mode=b.dataset.mode;syncUI();setInsight()}));
  document.querySelectorAll("[data-focus]").forEach(b=>b.addEventListener("click",()=>{state.focus=b.dataset.focus;syncUI()}));
  $("aperture").addEventListener("input",e=>{state.aperture=Number(e.target.value)/100;e.target.style.setProperty("--fill",e.target.value+"%");draw()});
  $("field").addEventListener("input",e=>{state.field=Number(e.target.value);e.target.style.setProperty("--fill",(state.field/12*100)+"%");draw()});
  $("wavelength").addEventListener("input",e=>{state.wavelength=Number(e.target.value);e.target.style.setProperty("--fill",((state.wavelength-450)/200*100)+"%");draw()});
  $("focus-position").addEventListener("input",e=>{state.focus="manual";state.focusZ=Number(e.target.value);e.target.style.setProperty("--fill",((state.focusZ-3.2)/2*100)+"%");syncUI()});
  $("show-rays").addEventListener("change",e=>{state.showRays=e.target.checked;draw()});
  $("show-mesh").addEventListener("change",e=>{state.showMesh=e.target.checked;draw()});
  $("reset").addEventListener("click",()=>{Object.assign(state,{mode:"spherical",aperture:.72,field:4,wavelength:550,focus:"paraxial",focusZ:4.2,showRays:true,showMesh:true,yaw:-.56,pitch:.20,zoom:1});syncUI();setInsight()});
  canvas.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.classList.add("dragging");canvas.setPointerCapture(e.pointerId)});
  canvas.addEventListener("pointermove",e=>{if(!dragging)return;state.yaw+=(e.clientX-lastX)*.009;state.pitch=clamp(state.pitch+(e.clientY-lastY)*.009,-.9,.9);lastX=e.clientX;lastY=e.clientY;draw()});
  canvas.addEventListener("pointerup",()=>{dragging=false;canvas.classList.remove("dragging")});
  canvas.addEventListener("pointercancel",()=>{dragging=false;canvas.classList.remove("dragging")});
  canvas.addEventListener("wheel",e=>{e.preventDefault();state.zoom=clamp(state.zoom*(e.deltaY>0?.92:1.08),.62,1.65);draw()},{passive:false});
  window.addEventListener("resize",resize);
  const copy={spherical:["球差","边缘光线与近轴光线落在不同 z 位置。"],coma:["彗差","离轴点成像后，光斑拖成彗星形。"],chromatic:["色差","不同波长的焦点沿光轴分离。"]};
  function setInsight(){ $("insight").dataset.mode=state.mode;$("insight-title").textContent=copy[state.mode][0];$("insight-copy").textContent=copy[state.mode][1]; }
  const modelContext=document.modelContext;
  if(modelContext&&modelContext.registerTool){
    const result=()=>({model:state.mode,parameters:{aperture:state.aperture,field:state.field,wavelength:state.wavelength,focus:state.focus,focusZ:focalPlane()},readings:{longitudinalAberration:state.mode==="spherical"?-.92*state.aperture*state.aperture:state.mode==="chromatic"?-(state.wavelength-550)*.0042:-.08*state.aperture*state.aperture}});
    try{modelContext.registerTool({name:"get_aberration_experiment",title:"读取像差实验",description:"读取当前三维像差模型的参数与读数。",inputSchema:{type:"object",properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:result});}catch(e){}
    try{modelContext.registerTool({name:"configure_aberration_experiment",title:"调节像差实验",description:"切换像差模型并设置孔径、视场角、波长与汇聚面位置。",inputSchema:{type:"object",properties:{model:{enum:["spherical","coma","chromatic"]},aperture:{type:"number",minimum:.25,maximum:1},field:{type:"number",minimum:0,maximum:12},wavelength:{type:"number",minimum:450,maximum:650},focus:{enum:["paraxial","best","manual"]},focusZ:{type:"number",minimum:3.2,maximum:5.2}},required:["model"],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||!["spherical","coma","chromatic"].includes(input.model))throw new Error("Invalid model");Object.assign(state,input);syncUI();return result()}});}catch(e){}
  }
  syncUI(); setInsight(); resize();
})();
</script>
</body>
</html>
